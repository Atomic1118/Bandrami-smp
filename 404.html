<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page { min-height: 100vh; display:grid; place-items:center; padding:30px; }
    .error-box { width:min(720px,100%); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:40px; background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)); text-align:center; }
    .error-code { color:#d94731; font:900 10px/1.2 ui-monospace,monospace; letter-spacing:.2em; }
    .error-box h1 { margin:12px 0 16px; font:1000 clamp(60px,15vw,150px)/.9 ui-monospace,monospace; }
    .error-box p { color:#9a9891; margin:0 auto 24px; max-width:540px; }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-box">
      <div class="error-code">ERROR / CONTENT NOT FOUND</div>
      <h1>404</h1>
      <p>This page does not exist. Use the main navigation to get back to the Minecraft community website.</p>
      <a class="button button-primary" href="./index.html#home">BACK HOME</a>
    </section>
  </main>
</body>
</html>
